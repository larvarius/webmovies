<style>
  /* ===== RESET Y ESTILOS BASE ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: #0f0e1a;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ===== CONTENEDOR PRINCIPAL ===== */
  .embed-generator {
    max-width: 920px;
    width: 100%;
    margin-top: 10px;
    padding: 20px 16px 30px;
    background: #1a1a2e;
    color: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* ===== ENCABEZADO ===== */
  .header { margin-bottom: 20px; text-align: center; }
  .header h1 { font-size: 28px; font-weight: 800; color: #e94560; margin-bottom: 4px; }
  .header .subtitle { font-size: 13px; color: #8888aa; }
  .header .subtitle span { color: #e94560; font-weight: 600; }

  /* ===== BUSCADOR ===== */
  .search-wrapper {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    width: 100%;
  }
  .search-wrapper .input-container {
    flex: 1;
    position: relative;
    min-width: 160px;
  }
  .search-wrapper .input-container .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.4;
  }
  .search-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
  }
  .search-wrapper input:focus {
    border-color: #e94560;
    background: rgba(255,255,255,0.07);
  }
  .search-wrapper .btn-search {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: #e94560;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 20px rgba(233,69,96,0.25);
    white-space: nowrap;
  }
  .search-wrapper .btn-search:hover {
    background: #c73652;
    transform: translateY(-2px);
  }

  /* ===== RESULTADOS ===== */
  .results {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 4px 0;
    max-height: 350px;
    overflow-y: auto;
    margin-bottom: 16px;
    display: none;
    border: 1px solid rgba(255,255,255,0.04);
    width: 100%;
  }
  .results::-webkit-scrollbar { width: 4px; }
  .results::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }
  .results .item {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    transition: 0.2s;
  }
  .results .item:hover { background: rgba(233,69,96,0.08); }
  .results .item .poster {
    width: 40px;
    height: 60px;
    border-radius: 6px;
    object-fit: cover;
    background: #1a1a2e;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .results .item .poster-placeholder {
    width: 40px;
    height: 60px;
    border-radius: 6px;
    background: #1a1a2e;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .results .item .info { flex: 1; min-width: 0; }
  .results .item .title { font-weight: 600; font-size: 13px; display: block; }
  .results .item .meta { color: #666688; font-size: 11px; }
  .results .item .badge {
    background: rgba(233,69,96,0.15);
    color: #e94560;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .results .item .badge.serie {
    background: rgba(79,195,247,0.15);
    color: #4fc3f7;
  }

  .loading { text-align: center; padding: 16px; color: #666688; display: none; font-size: 13px; }
  .error-msg { color: #e94560; padding: 16px; text-align: center; }
  .no-results { padding: 16px; text-align: center; color: #555577; }

  /* ===================================================== */
  /* ===== REPRODUCTOR – ANCHO COMPLETO, ALTURA FIJA ===== */
  /* ===================================================== */
  .result-box {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    margin-top: 16px;
    display: none;
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
    width: 100%;
  }

  .player-wrapper {
    width: 100%;
    background: #000;
    position: relative;
    overflow: hidden;
  }

  /* Altura fija de 500px para que los controles se vean grandes */
  .player-container {
    width: 100%;
    height: 500px;  /* <- ALTURA FIJA */
    background: #000;
    position: relative;
    overflow: hidden;
  }

  .player-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .player-container .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444466;
    font-size: 13px;
    background: #0a0a15;
    flex-direction: column;
    gap: 10px;
  }
  .player-container .placeholder .icon { font-size: 36px; }

  /* ===== CONTROLES DE SERIE (DEBAJO) ===== */
  .series-controls {
    padding: 12px 16px 16px 16px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.05);
    display: none;
    width: 100%;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .series-controls .info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .series-controls .info .tipo-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    background: rgba(233,69,96,0.25);
    color: #e94560;
    white-space: nowrap;
  }
  .series-controls .info .tipo-badge.pelicula {
    background: rgba(45,106,79,0.25);
    color: #52b788;
  }
  .series-controls .info .title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .series-controls .season-episode {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .series-controls .season-episode .field-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .series-controls .season-episode .field-group label {
    color: #aaaacc;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .series-controls .season-episode input {
    width: 50px;
    padding: 5px 4px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
  }
  .series-controls .season-episode input:focus { border-color: #e94560; }
  .series-controls .btn-generate {
    padding: 6px 18px;
    border: none;
    border-radius: 6px;
    background: #2d6a4f;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
  }
  .series-controls .btn-generate:hover {
    background: #409f7a;
    transform: scale(1.02);
  }

  /* ============================================================ */
  /* ===== RESPONSIVE – MÓVIL ===== */
  /* ============================================================ */
  @media (max-width: 768px) {
    body { padding: 4px; }
    .embed-generator {
      padding: 10px 8px 14px;
      border-radius: 12px;
      margin-top: 4px;
      max-width: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    .header h1 { font-size: 18px; }
    .header .subtitle { font-size: 10px; }

    .search-wrapper { gap: 4px; width: 100%; }
    .search-wrapper .btn-search {
      width: 100%;
      justify-content: center;
      padding: 10px;
      font-size: 13px;
      border-radius: 10px;
    }
    .search-wrapper .input-container {
      min-width: 100%;
      width: 100%;
    }
    .search-wrapper input {
      padding: 10px 10px 10px 36px;
      font-size: 13px;
      border-radius: 10px;
      width: 100%;
    }
    .search-wrapper .input-container .search-icon {
      left: 10px;
      font-size: 14px;
    }

    .results { border-radius: 10px; max-height: 250px; width: 100%; }
    .results .item { padding: 6px 10px; gap: 8px; width: 100%; }
    .results .item .poster { width: 32px; height: 48px; }
    .results .item .poster-placeholder { width: 32px; height: 48px; font-size: 14px; }
    .results .item .title { font-size: 12px; }
    .results .item .meta { font-size: 10px; }
    .results .item .badge { font-size: 8px; padding: 2px 8px; }

    /* Móvil: altura del reproductor se reduce un poco pero sigue siendo grande */
    .player-container {
      height: 300px; /* <- altura fija en móvil, suficiente para controles grandes */
    }

    .result-box { border-radius: 10px; width: 100%; margin-top: 12px; }
    .series-controls {
      padding: 10px 10px 14px 10px;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .series-controls .info .title { font-size: 13px; }
    .series-controls .season-episode {
      justify-content: space-between;
      width: 100%;
    }
    .series-controls .season-episode .field-group label { font-size: 10px; }
    .series-controls .season-episode input { width: 42px; padding: 4px 2px; font-size: 13px; }
    .series-controls .btn-generate {
      padding: 6px 14px;
      font-size: 12px;
      width: 100%;
      text-align: center;
    }
    .player-container .placeholder .icon { font-size: 24px; }
    .player-container .placeholder { font-size: 11px; gap: 6px; }
  }

  /* Tablets y pantallas grandes */
  @media (min-width: 769px) and (max-width: 1024px) {
    .embed-generator { padding: 18px 16px 24px; }
    .header h1 { font-size: 26px; }
    .player-container { height: 450px; }
  }
  @media (min-width: 1400px) {
    .embed-generator { max-width: 1100px; padding: 36px 32px 44px; margin-top: 30px; }
    .header h1 { font-size: 40px; }
    .header .subtitle { font-size: 16px; }
    .search-wrapper input { font-size: 17px; padding: 16px 20px 16px 48px; }
    .search-wrapper .btn-search { padding: 16px 36px; font-size: 16px; }
    .results .item .poster { width: 54px; height: 80px; }
    .player-container { height: 600px; }
  }
</style>

<!-- ===== HTML ===== -->
<div class="embed-generator" id="app">
  <div class="header">
    <h1>🔍 Buscador</h1>
    <div class="subtitle">Busca un título y <span>genera un reproductor</span> al instante</div>
  </div>

  <div class="search-wrapper">
    <div class="input-container">
      <span class="search-icon">🔎</span>
      <input type="text" id="searchInput" placeholder="Ej: Inception, Game of Thrones, Avatar..." />
    </div>
    <button class="btn-search" id="searchBtn">Buscar</button>
  </div>

  <div class="loading" id="loadingMsg">Buscando<span class="dots"></span></div>

  <div class="results" id="resultsContainer"></div>

  <div class="result-box" id="resultBox">
    <!-- REPRODUCTOR A ANCHO COMPLETO CON ALTURA FIJA -->
    <div class="player-wrapper">
      <div class="player-container" id="playerContainer">
        <div class="placeholder" id="placeholderMsg">
          <span class="icon">🎬</span>
          <span>Selecciona un resultado</span>
        </div>
      </div>
    </div>

    <!-- CONTROLES DE SERIE (DEBAJO) -->
    <div class="series-controls" id="seriesControls">
      <div class="info">
        <span class="tipo-badge" id="tipoBadge">🎬 Película</span>
        <span class="title" id="seriesTitle">—</span>
      </div>
      <div class="season-episode" id="seasonEpisodeContainer">
        <div class="field-group">
          <label>T</label>
          <input type="number" id="seasonInput" value="1" min="1" max="99" />
        </div>
        <div class="field-group">
          <label>E</label>
          <input type="number" id="episodeInput" value="1" min="1" max="99" />
        </div>
        <button class="btn-generate" id="generateSeriesBtn">▶ Generar</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== JAVASCRIPT ===== -->
<script>
(function() {
  var TMDB_API_KEY = '21a22bb78b0e53d514e8a95bc34fc4b2';
  var TMDB_BASE = 'https://api.themoviedb.org/3';
  var IMAGE_BASE = 'https://image.tmdb.org/t/p/w92';

  var selectedId = null, selectedType = null, selectedTitleText = '';

  var searchInput = document.getElementById('searchInput');
  var searchBtn = document.getElementById('searchBtn');
  var resultsContainer = document.getElementById('resultsContainer');
  var loadingMsg = document.getElementById('loadingMsg');
  var resultBox = document.getElementById('resultBox');
  var playerContainer = document.getElementById('playerContainer');
  var placeholderMsg = document.getElementById('placeholderMsg');
  var seriesControls = document.getElementById('seriesControls');
  var tipoBadge = document.getElementById('tipoBadge');
  var seriesTitle = document.getElementById('seriesTitle');
  var seasonInput = document.getElementById('seasonInput');
  var episodeInput = document.getElementById('episodeInput');
  var generateSeriesBtn = document.getElementById('generateSeriesBtn');

  function buscar() {
    var query = searchInput.value.trim();
    if (!query) { mostrarError('Escribe un título para buscar'); return; }
    mostrarLoading(true);
    resultsContainer.style.display = 'none';
    resultBox.style.display = 'none';

    var url = TMDB_BASE + '/search/multi?api_key=' + TMDB_API_KEY + '&query=' + encodeURIComponent(query) + '&language=es-ES';
    fetch(url)
      .then(function(res) { if (!res.ok) throw new Error('Error en la API'); return res.json(); })
      .then(function(data) {
        mostrarLoading(false);
        if (data.results && data.results.length > 0) {
          mostrarResultados(data.results);
        } else {
          resultsContainer.innerHTML = '<div class="no-results">No se encontraron resultados para "' + query + '"</div>';
          resultsContainer.style.display = 'block';
        }
      })
      .catch(function(err) { mostrarLoading(false); mostrarError('Error: ' + err.message); });
  }

  function mostrarResultados(resultados) {
    var html = '', contador = 0;
    resultados.forEach(function(item) {
      if (item.media_type === 'person') return;
      var titulo = item.title || item.name || 'Sin título';
      var año = item.release_date ? item.release_date.split('-')[0] : (item.first_air_date ? item.first_air_date.split('-')[0] : '');
      var tipo = item.media_type === 'movie' ? '🎬 Película' : '📺 Serie';
      var badgeClass = item.media_type === 'movie' ? '' : 'serie';
      var id = item.id;
      var posterPath = item.poster_path;
      var posterHtml = posterPath ? '<img class="poster" src="' + IMAGE_BASE + posterPath + '" alt="' + titulo + '" loading="lazy" />' : '<div class="poster-placeholder">' + (item.media_type === 'movie' ? '🎬' : '📺') + '</div>';
      html += '<div class="item" data-id="' + id + '" data-type="' + item.media_type + '" data-title="' + titulo + '">' +
        posterHtml +
        '<div class="info"><span class="title">' + titulo + '</span><span class="meta">' + (año ? '• ' + año : '') + '</span></div>' +
        '<span class="badge ' + badgeClass + '">' + tipo + '</span>' +
      '</div>';
      contador++;
    });
    if (contador === 0) {
      resultsContainer.innerHTML = '<div class="no-results">No se encontraron películas o series</div>';
    } else {
      resultsContainer.innerHTML = html;
    }
    resultsContainer.style.display = 'block';

    var items = document.querySelectorAll('.results .item');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function() {
        var id = this.dataset.id, type = this.dataset.type, title = this.dataset.title;
        seleccionarContenido(id, type, title);
        resultsContainer.style.display = 'none';
      });
    }
  }

  function seleccionarContenido(id, type, title) {
    selectedId = id; selectedType = type; selectedTitleText = title;
    resultBox.style.display = 'block';
    var isMovie = type === 'movie';
    var oldIframe = playerContainer.querySelector('iframe');
    if (oldIframe) oldIframe.remove();
    placeholderMsg.style.display = 'flex';
    placeholderMsg.innerHTML = '<span class="icon">' + (isMovie ? '🎬' : '📺') + '</span><span>' + (isMovie ? 'Cargando película...' : 'Selecciona temporada y episodio') + '</span>';
    tipoBadge.textContent = isMovie ? '🎬 Película' : '📺 Serie';
    tipoBadge.className = 'tipo-badge ' + (isMovie ? 'pelicula' : '');
    seriesTitle.textContent = title;
    if (isMovie) {
      seriesControls.style.display = 'none';
      generarEmbed(id, 'movie', null, null);
    } else {
      seriesControls.style.display = 'flex';
    }
    setTimeout(function() { resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
  }

  function generarEmbed(id, type, season, episode) {
    var isMovie = type === 'movie';
    var url = isMovie ? 'https://unlimplay.com/f/embed/movie/' + id : 'https://unlimplay.com/f/embed/tv/' + id + '/' + season + '/' + episode;
    placeholderMsg.style.display = 'none';
    var oldIframe = playerContainer.querySelector('iframe');
    if (oldIframe) oldIframe.remove();
    var iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.allowFullscreen = true;
    iframe.allow = 'autoplay; encrypted-media';
    iframe.id = 'playerIframe';
    playerContainer.appendChild(iframe);
  }

  function mostrarLoading(estado) { loadingMsg.style.display = estado ? 'block' : 'none'; }
  function mostrarError(mensaje) { resultsContainer.innerHTML = '<div class="error-msg">⚠️ ' + mensaje + '</div>'; resultsContainer.style.display = 'block'; }

  searchBtn.addEventListener('click', buscar);
  searchInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') buscar(); });
  generateSeriesBtn.addEventListener('click', function() {
    if (!selectedId || selectedType !== 'tv') return;
    var season = parseInt(seasonInput.value) || 1;
    var episode = parseInt(episodeInput.value) || 1;
    generarEmbed(selectedId, 'tv', season, episode);
  });

  console.log('🔍 Buscador con reproductor a ancho completo cargado.');
})();
</script>
