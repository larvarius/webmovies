<div class="embed-generator" id="app">
  <h1>🎬 GENERADOR DE EMBED</h1>
  <div class="subtitle">Buscá un título y generá el embed al instante · TMDB</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Ej: Barman, Game of Thrones, Inception..." />
    <button id="searchBtn">🔍 Buscar</button>
  </div>

  <div class="loading" id="loadingMsg">Buscando<span class="dots"></span></div>

  <div class="results" id="resultsContainer"></div>

  <div class="result-box" id="resultBox">
    <!-- Cabecera del contenido seleccionado -->
    <div id="selectedInfo">
      <span class="info-tipo" id="tipoBadge">🎬 PELÍCULA</span>
      <div class="selected-title" id="selectedTitle">—</div>
    </div>

    <!-- Para películas: solo ID -->
    <div id="movieFields">
      <label>TMDB ID</label>
      <div class="url-display" id="tmdbIdDisplay">—</div>
    </div>

    <!-- Para series: temporada y episodio -->
    <div id="seriesFields" style="display:none;">
      <label>TMDB ID</label>
      <div class="url-display" id="tmdbIdDisplaySerie">—</div>
      
      <label>Selecciona temporada y episodio</label>
      <div class="season-episode">
        <div class="field-group">
          <label>Temporada</label>
          <input type="number" id="seasonInput" value="1" min="1" max="99" />
        </div>
        <div class="field-group">
          <label>Episodio</label>
          <input type="number" id="episodeInput" value="1" min="1" max="99" />
        </div>
        <button class="btn-generate" id="generateSeriesBtn">▶ Generar con estos datos</button>
      </div>
    </div>

    <!-- Resultado del embed -->
    <div id="embedResult" style="display:none; margin-top:20px; border-top:1px solid #2d2d4a; padding-top:20px;">
      <label>URL GENERADA</label>
      <div class="url-display" id="generatedUrl">—</div>

      <label>CÓDIGO IFRAME</label>
      <textarea id="iframeCode" readonly></textarea>
      <button class="copy-btn" id="copyBtn">📋 Copiar código</button>

      <label>VISTA PREVIA</label>
      <div class="preview" id="previewContainer">
        <div style="display:flex;align-items:center;justify-content:center;height:400px;color:#666;font-size:14px;">
          Genera el embed para ver la vista previa
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // ===== CONFIGURACIÓN =====
  const TMDB_API_KEY = '21a22bb78b0e53d514e8a95bc34fc4b2';
  const TMDB_BASE = 'https://api.themoviedb.org/3';

  // ===== VARIABLES GLOBALES =====
  let selectedId = null;
  let selectedType = null;
  let selectedTitleText = '';

  // ===== ELEMENTOS DOM =====
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultsContainer = document.getElementById('resultsContainer');
  const loadingMsg = document.getElementById('loadingMsg');
  const resultBox = document.getElementById('resultBox');
  
  const tipoBadge = document.getElementById('tipoBadge');
  const selectedTitle = document.getElementById('selectedTitle');
  const tmdbIdDisplay = document.getElementById('tmdbIdDisplay');
  const tmdbIdDisplaySerie = document.getElementById('tmdbIdDisplaySerie');
  
  const movieFields = document.getElementById('movieFields');
  const seriesFields = document.getElementById('seriesFields');
  const seasonInput = document.getElementById('seasonInput');
  const episodeInput = document.getElementById('episodeInput');
  const generateSeriesBtn = document.getElementById('generateSeriesBtn');
  
  const embedResult = document.getElementById('embedResult');
  const generatedUrl = document.getElementById('generatedUrl');
  const iframeCode = document.getElementById('iframeCode');
  const previewContainer = document.getElementById('previewContainer');
  const copyBtn = document.getElementById('copyBtn');

  // ===== FUNCIONES PRINCIPALES =====
  function buscarEnTMDB(query) {
    if (!query.trim()) {
      mostrarError('Escribe un título para buscar');
      return;
    }
    
    mostrarLoading(true);
    resultsContainer.style.display = 'none';
    resultBox.style.display = 'none';

    const url = `${TMDB_BASE}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=es-ES`;

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Error en la API (código ' + res.status + ')');
        return res.json();
      })
      .then(data => {
        mostrarLoading(false);
        if (data.results && data.results.length > 0) {
          mostrarResultados(data.results);
        } else {
          resultsContainer.innerHTML = `<div style="padding:20px;text-align:center;color:#888;">No se encontraron resultados para "${query}"</div>`;
          resultsContainer.style.display = 'block';
        }
      })
      .catch(err => {
        mostrarLoading(false);
        mostrarError('Error: ' + err.message);
      });
  }

  function mostrarResultados(resultados) {
    let html = '';
    let contador = 0;
    
    resultados.forEach(item => {
      if (item.media_type === 'person') return;
      
      const titulo = item.title || item.name || 'Sin título';
      const año = item.release_date ? item.release_date.split('-')[0] : (item.first_air_date ? item.first_air_date.split('-')[0] : '');
      const tipo = item.media_type === 'movie' ? '🎬 PELÍCULA' : '📺 SERIE';
      const id = item.id;
      
      html += `
        <div class="item" data-id="${id}" data-type="${item.media_type}" data-title="${titulo}">
          <div>
            <span class="title">${titulo}</span>
            <span class="meta">${año ? ' • ' + año : ''}</span>
          </div>
          <span class="badge">${tipo}</span>
        </div>
      `;
      contador++;
    });
    
    if (contador === 0) {
      resultsContainer.innerHTML = `<div style="padding:20px;text-align:center;color:#888;">No se encontraron películas o series</div>`;
    } else {
      resultsContainer.innerHTML = html;
    }
    resultsContainer.style.display = 'block';

    // Evento click en cada resultado
    document.querySelectorAll('.results .item').forEach(el => {
      el.addEventListener('click', function() {
        const id = this.dataset.id;
        const type = this.dataset.type;
        const title = this.dataset.title;
        seleccionarContenido(id, type, title);
        resultsContainer.style.display = 'none';
      });
    });
  }

  function seleccionarContenido(id, type, title) {
    selectedId = id;
    selectedType = type;
    selectedTitleText = title;

    // Mostrar el cuadro de resultados
    resultBox.style.display = 'block';
    embedResult.style.display = 'none';

    // Actualizar información
    const isMovie = type === 'movie';
    tipoBadge.textContent = isMovie ? '🎬 PELÍCULA' : '📺 SERIE';
    tipoBadge.className = 'info-tipo ' + (isMovie ? 'tipo-pelicula' : 'tipo-serie');
    selectedTitle.textContent = title;

    if (isMovie) {
      // Modo película
      movieFields.style.display = 'block';
      seriesFields.style.display = 'none';
      tmdbIdDisplay.textContent = id + ' · Película';
      
      // Generar automáticamente el embed
      generarEmbed(id, 'movie', null, null);
    } else {
      // Modo serie
      movieFields.style.display = 'none';
      seriesFields.style.display = 'block';
      tmdbIdDisplaySerie.textContent = id + ' · Serie';
      
      // Ocultar embed hasta que el usuario elija T y E
      embedResult.style.display = 'none';
    }

    // Scroll al resultado
    setTimeout(() => {
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);
  }

  function generarEmbed(id, type, season, episode) {
    const isMovie = type === 'movie';
    let url;
    
    if (isMovie) {
      url = `https://unlimplay.com/f/embed/movie/${id}`;
    } else {
      url = `https://unlimplay.com/f/embed/tv/${id}/${season}/${episode}`;
    }

    generatedUrl.textContent = url;

    const iframeHtml = `<iframe src="${url}" width="100%" height="500" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
    iframeCode.value = iframeHtml;

    // Vista previa
    previewContainer.innerHTML = `<iframe src="${url}" width="100%" height="400" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;

    embedResult.style.display = 'block';
  }

  function mostrarLoading(estado) {
    loadingMsg.style.display = estado ? 'block' : 'none';
  }

  function mostrarError(mensaje) {
    resultsContainer.innerHTML = `<div class="error-msg">⚠️ ${mensaje}</div>`;
    resultsContainer.style.display = 'block';
  }

  // ===== EVENTOS =====
  searchBtn.addEventListener('click', function() {
    buscarEnTMDB(searchInput.value);
  });

  searchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      buscarEnTMDB(searchInput.value);
    }
  });

  // Botón para generar embed de serie
  generateSeriesBtn.addEventListener('click', function() {
    if (!selectedId || selectedType !== 'tv') return;
    const season = parseInt(seasonInput.value) || 1;
    const episode = parseInt(episodeInput.value) || 1;
    generarEmbed(selectedId, 'tv', season, episode);
  });

  // Botón copiar
  copyBtn.addEventListener('click', function() {
    iframeCode.select();
    document.execCommand('copy');
    const original = copyBtn.textContent;
    copyBtn.textContent = '✅ ¡Copiado!';
    setTimeout(() => { copyBtn.textContent = original; }, 2000);
  });

  console.log('🎬 Generador de Embed (versión mejorada) cargado correctamente.');
})();
  </script>
