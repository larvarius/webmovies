<style>
  /* ===== RESET Y BASE ===== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .embed-generator {
    max-width: 920px;
    margin: 0 auto;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 30px 25px 40px;
    background: linear-gradient(145deg, #0f0e1a 0%, #1a1a2e 100%);
    color: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }

  /* Efecto de brillo superior */
  .embed-generator::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(233, 69, 96, 0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ===== ENCABEZADO ===== */
  .embed-generator .header {
    position: relative;
    z-index: 1;
    margin-bottom: 28px;
    text-align: center;
  }

  .embed-generator .header h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e94560 0%, #ff6b8a 50%, #e94560 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease-in-out infinite;
    margin-bottom: 6px;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .embed-generator .header .subtitle {
    font-size: 15px;
    color: #8888aa;
    letter-spacing: 0.3px;
    font-weight: 400;
  }

  .embed-generator .header .subtitle span {
    color: #e94560;
    font-weight: 600;
  }

  /* ===== BUSCADOR ===== */
  .embed-generator .search-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .embed-generator .search-wrapper .input-container {
    flex: 1;
    position: relative;
    min-width: 220px;
  }

  .embed-generator .search-wrapper .input-container .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    opacity: 0.4;
    pointer-events: none;
  }

  .embed-generator .search-wrapper input {
    width: 100%;
    padding: 15px 18px 15px 48px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.3s ease;
    outline: none;
  }

  .embed-generator .search-wrapper input::placeholder {
    color: #555577;
    font-weight: 400;
  }

  .embed-generator .search-wrapper input:focus {
    border-color: #e94560;
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.08);
  }

  .embed-generator .search-wrapper input:focus + .search-icon {
    opacity: 1;
  }

  .embed-generator .search-wrapper .btn-search {
    padding: 15px 32px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #e94560, #c73652);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.25);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .embed-generator .search-wrapper .btn-search:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(233, 69, 96, 0.4);
  }

  .embed-generator .search-wrapper .btn-search:active {
    transform: translateY(0px);
  }

  /* ===== RESULTADOS ===== */
  .embed-generator .results {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 6px 0;
    max-height: 320px;
    overflow-y: auto;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
  }

  .embed-generator .results::-webkit-scrollbar {
    width: 4px;
  }

  .embed-generator .results::-webkit-scrollbar-track {
    background: transparent;
  }

  .embed-generator .results::-webkit-scrollbar-thumb {
    background: #e94560;
    border-radius: 4px;
  }

  .embed-generator .results .item {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .embed-generator .results .item:hover {
    background: rgba(233, 69, 96, 0.08);
    padding-left: 24px;
  }

  .embed-generator .results .item:last-child {
    border-bottom: none;
  }

  .embed-generator .results .item .title {
    font-weight: 600;
    font-size: 15px;
  }

  .embed-generator .results .item .meta {
    color: #666688;
    font-size: 13px;
    margin-left: 10px;
  }

  .embed-generator .results .item .badge {
    background: rgba(233, 69, 96, 0.15);
    color: #e94560;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .embed-generator .results .item .badge.serie {
    background: rgba(79, 195, 247, 0.15);
    color: #4fc3f7;
  }

  /* ===== LOADING ===== */
  .embed-generator .loading {
    text-align: center;
    padding: 24px;
    color: #666688;
    display: none;
    font-size: 14px;
    position: relative;
    z-index: 1;
  }

  .embed-generator .loading .dots::after {
    content: '';
    animation: dots 1.5s steps(4) infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  /* ===== ERROR ===== */
  .embed-generator .error-msg {
    color: #e94560;
    padding: 20px;
    text-align: center;
    font-size: 14px;
  }

  .embed-generator .no-results {
    padding: 24px;
    text-align: center;
    color: #555577;
    font-size: 14px;
  }

  /* ===== RESULT BOX ===== */
  .embed-generator .result-box {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 24px;
    margin-top: 20px;
    display: none;
    border: 1px solid rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .embed-generator .result-box .selected-info {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .embed-generator .result-box .tipo-badge {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .embed-generator .result-box .tipo-badge.pelicula {
    background: rgba(45, 106, 79, 0.25);
    color: #52b788;
  }

  .embed-generator .result-box .tipo-badge.serie {
    background: rgba(233, 69, 96, 0.2);
    color: #e94560;
  }

  .embed-generator .result-box .selected-title {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }

  .embed-generator .result-box .selected-id {
    color: #555577;
    font-size: 13px;
    font-family: monospace;
    margin-left: auto;
  }

  /* ===== CAMPOS SERIE ===== */
  .embed-generator .result-box .series-fields {
    margin-top: 12px;
    padding: 16px 0 0 0;
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  .embed-generator .result-box .series-fields label {
    color: #8888aa;
    font-size: 13px;
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .embed-generator .result-box .season-episode {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .embed-generator .result-box .season-episode .field-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .embed-generator .result-box .season-episode .field-group label {
    margin-bottom: 0;
    font-size: 13px;
    color: #666688;
  }

  .embed-generator .result-box .season-episode input {
    width: 70px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: 0.3s;
  }

  .embed-generator .result-box .season-episode input:focus {
    border-color: #e94560;
  }

  .embed-generator .result-box .btn-generate {
    padding: 10px 28px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2d6a4f, #409f7a);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(45, 106, 79, 0.25);
  }

  .embed-generator .result-box .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(45, 106, 79, 0.35);
  }

  /* ===== EMBED RESULT ===== */
  .embed-generator .result-box .embed-result {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.04);
    display: none;
    animation: fadeUp 0.4s ease;
  }

  .embed-generator .result-box .embed-result label {
    color: #8888aa;
    font-size: 13px;
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .embed-generator .result-box .embed-result label:first-child {
    margin-top: 0;
  }

  .embed-generator .result-box .url-display {
    background: rgba(0,0,0,0.4);
    padding: 12px 16px;
    border-radius: 10px;
    word-break: break-all;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 14px;
    color: #4fc3f7;
    border: 1px solid rgba(79, 195, 247, 0.06);
  }

  .embed-generator .result-box textarea {
    width: 100%;
    background: rgba(0,0,0,0.4);
    color: #4fc3f7;
    border: 1px solid rgba(79, 195, 247, 0.06);
    border-radius: 10px;
    padding: 14px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: 0.3s;
  }

  .embed-generator .result-box textarea:focus {
    border-color: #e94560;
  }

  .embed-generator .result-box .copy-btn {
    background: rgba(255,255,255,0.06);
    color: #aaaacc;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 6px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
    transition: all 0.3s ease;
  }

  .embed-generator .result-box .copy-btn:hover {
    background: rgba(45, 106, 79, 0.2);
    border-color: #2d6a4f;
    color: #52b788;
  }

  .embed-generator .result-box .preview {
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(0,0,0,0.4);
    min-height: 320px;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .embed-generator .result-box .preview iframe {
    width: 100%;
    height: 400px;
    border: none;
  }

  .embed-generator .result-box .preview-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 320px;
    color: #444466;
    font-size: 14px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .embed-generator {
      padding: 20px 16px 30px;
      border-radius: 16px;
    }
    .embed-generator .header h1 {
      font-size: 26px;
    }
    .embed-generator .search-wrapper .btn-search {
      width: 100%;
      justify-content: center;
      padding: 14px;
    }
    .embed-generator .search-wrapper .input-container {
      min-width: 100%;
    }
    .embed-generator .result-box .selected-title {
      font-size: 17px;
    }
    .embed-generator .result-box .selected-id {
      margin-left: 0;
      width: 100%;
    }
    .embed-generator .result-box .season-episode {
      flex-direction: column;
      align-items: stretch;
    }
    .embed-generator .result-box .season-episode .field-group {
      justify-content: space-between;
    }
    .embed-generator .result-box .season-episode input {
      width: 60px;
    }
    .embed-generator .result-box .btn-generate {
      width: 100%;
      text-align: center;
    }
    .embed-generator .results .item {
      flex-wrap: wrap;
      gap: 6px;
    }
    .embed-generator .results .item .badge {
      font-size: 10px;
      padding: 2px 12px;
    }
  }
</style>

<!-- ===== HTML ===== -->
<div class="embed-generator" id="app">
  <div class="header">
    <h1>🔍 Buscador</h1>
    <div class="subtitle">Busca un título y <span>genera un reproductor</span> al instante</div>
  </div>

  <div class="search-wrapper">
    <div class="input-container">
      <span class="search-icon">🔎</span>
      <input type="text" id="searchInput" placeholder="Ej: Inception, Game of Thrones, Avatar..." />
    </div>
    <button class="btn-search" id="searchBtn">
      <span>Buscar</span>
    </button>
  </div>

  <div class="loading" id="loadingMsg">Buscando<span class="dots"></span></div>

  <div class="results" id="resultsContainer"></div>

  <div class="result-box" id="resultBox">
    <div class="selected-info">
      <span class="tipo-badge pelicula" id="tipoBadge">🎬 Película</span>
      <span class="selected-title" id="selectedTitle">—</span>
      <span class="selected-id" id="selectedIdDisplay">#—</span>
    </div>

    <!-- Campos para series -->
    <div class="series-fields" id="seriesFields" style="display:none;">
      <label>📺 Selecciona temporada y episodio</label>
      <div class="season-episode">
        <div class="field-group">
          <label>Temporada</label>
          <input type="number" id="seasonInput" value="1" min="1" max="99" />
        </div>
        <div class="field-group">
          <label>Episodio</label>
          <input type="number" id="episodeInput" value="1" min="1" max="99" />
        </div>
        <button class="btn-generate" id="generateSeriesBtn">▶ Generar</button>
      </div>
    </div>

    <!-- Resultado del embed -->
    <div class="embed-result" id="embedResult">
      <label>🔗 URL generada</label>
      <div class="url-display" id="generatedUrl">—</div>

      <label>📋 Código iframe</label>
      <textarea id="iframeCode" readonly></textarea>
      <button class="copy-btn" id="copyBtn">📄 Copiar código</button>

      <label>👁️ Vista previa</label>
      <div class="preview" id="previewContainer">
        <div class="preview-placeholder">Selecciona un resultado para ver la vista previa</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== JAVASCRIPT ===== -->
<script>
(function() {
  const TMDB_API_KEY = '21a22bb78b0e53d514e8a95bc34fc4b2';
  const TMDB_BASE = 'https://api.themoviedb.org/3';

  let selectedId = null;
  let selectedType = null;
  let selectedTitleText = '';

  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultsContainer = document.getElementById('resultsContainer');
  const loadingMsg = document.getElementById('loadingMsg');
  const resultBox = document.getElementById('resultBox');

  const tipoBadge = document.getElementById('tipoBadge');
  const selectedTitle = document.getElementById('selectedTitle');
  const selectedIdDisplay = document.getElementById('selectedIdDisplay');

  const seriesFields = document.getElementById('seriesFields');
  const seasonInput = document.getElementById('seasonInput');
  const episodeInput = document.getElementById('episodeInput');
  const generateSeriesBtn = document.getElementById('generateSeriesBtn');

  const embedResult = document.getElementById('embedResult');
  const generatedUrl = document.getElementById('generatedUrl');
  const iframeCode = document.getElementById('iframeCode');
  const previewContainer = document.getElementById('previewContainer');
  const copyBtn = document.getElementById('copyBtn');

  function buscar() {
    const query = searchInput.value.trim();
    if (!query) {
      mostrarError('Escribe un título para buscar');
      return;
    }

    mostrarLoading(true);
    resultsContainer.style.display = 'none';
    resultBox.style.display = 'none';

    const url = `${TMDB_BASE}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=es-ES`;

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('Error en la API (código ' + res.status + ')');
        return res.json();
      })
      .then(data => {
        mostrarLoading(false);
        if (data.results && data.results.length > 0) {
          mostrarResultados(data.results);
        } else {
          resultsContainer.innerHTML = `<div class="no-results">No se encontraron resultados para "${query}"</div>`;
          resultsContainer.style.display = 'block';
        }
      })
      .catch(err => {
        mostrarLoading(false);
        mostrarError('Error: ' + err.message);
      });
  }

  function mostrarResultados(resultados) {
    let html = '';
    let contador = 0;

    resultados.forEach(item => {
      if (item.media_type === 'person') return;

      const titulo = item.title || item.name || 'Sin título';
      const año = item.release_date ? item.release_date.split('-')[0] : (item.first_air_date ? item.first_air_date.split('-')[0] : '');
      const tipo = item.media_type === 'movie' ? '🎬 Película' : '📺 Serie';
      const badgeClass = item.media_type === 'movie' ? '' : 'serie';
      const id = item.id;

      html += `
        <div class="item" data-id="${id}" data-type="${item.media_type}" data-title="${titulo}">
          <div>
            <span class="title">${titulo}</span>
            <span class="meta">${año ? '• ' + año : ''}</span>
          </div>
          <span class="badge ${badgeClass}">${tipo}</span>
        </div>
      `;
      contador++;
    });

    if (contador === 0) {
      resultsContainer.innerHTML = `<div class="no-results">No se encontraron películas o series</div>`;
    } else {
      resultsContainer.innerHTML = html;
    }
    resultsContainer.style.display = 'block';

    document.querySelectorAll('.results .item').forEach(el => {
      el.addEventListener('click', function() {
        const id = this.dataset.id;
        const type = this.dataset.type;
        const title = this.dataset.title;
        seleccionarContenido(id, type, title);
        resultsContainer.style.display = 'none';
      });
    });
  }

  function seleccionarContenido(id, type, title) {
    selectedId = id;
    selectedType = type;
    selectedTitleText = title;

    resultBox.style.display = 'block';
    embedResult.style.display = 'none';

    const isMovie = type === 'movie';

    tipoBadge.textContent = isMovie ? '🎬 Película' : '📺 Serie';
    tipoBadge.className = 'tipo-badge ' + (isMovie ? 'pelicula' : 'serie');
    selectedTitle.textContent = title;
    selectedIdDisplay.textContent = '#' + id;

    if (isMovie) {
      seriesFields.style.display = 'none';
      generarEmbed(id, 'movie', null, null);
    } else {
      seriesFields.style.display = 'block';
      embedResult.style.display = 'none';
    }

    setTimeout(() => {
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);
  }

  function generarEmbed(id, type, season, episode) {
    const isMovie = type === 'movie';
    let url;

    if (isMovie) {
      url = `https://unlimplay.com/f/embed/movie/${id}`;
    } else {
      url = `https://unlimplay.com/f/embed/tv/${id}/${season}/${episode}`;
    }

    generatedUrl.textContent = url;

    const iframeHtml = `<iframe src="${url}" width="100%" height="500" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
    iframeCode.value = iframeHtml;

    previewContainer.innerHTML = `<iframe src="${url}" width="100%" height="400" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;

    embedResult.style.display = 'block';
  }

  function mostrarLoading(estado) {
    loadingMsg.style.display = estado ? 'block' : 'none';
  }

  function mostrarError(mensaje) {
    resultsContainer.innerHTML = `<div class="error-msg">⚠️ ${mensaje}</div>`;
    resultsContainer.style.display = 'block';
  }

  // EVENTOS
  searchBtn.addEventListener('click', buscar);
  searchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') buscar();
  });

  generateSeriesBtn.addEventListener('click', function() {
    if (!selectedId || selectedType !== 'tv') return;
    const season = parseInt(seasonInput.value) || 1;
    const episode = parseInt(episodeInput.value) || 1;
    generarEmbed(selectedId, 'tv', season, episode);
  });

  copyBtn.addEventListener('click', function() {
    iframeCode.select();
    document.execCommand('copy');
    const original = copyBtn.textContent;
    copyBtn.textContent = '✅ ¡Copiado!';
    setTimeout(() => { copyBtn.textContent = original; }, 2000);
  });

  console.log('🔍 Buscador de UnLimPlay cargado correctamente.');
})();
</script>
